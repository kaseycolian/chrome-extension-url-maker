<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>What the URL</title>
    <!-- Applies the saved theme before first paint (no flash). Must stay external
         and first — MV3 CSP blocks inline scripts. -->
    <script src="theme/theme-init.js"></script>
    <link rel="stylesheet" href="theme/theme.css" />
    <link rel="stylesheet" href="theme/effects.css" />
    <link rel="stylesheet" href="theme/dropdown.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="grid-bg fx-grid"></div>
    <main class="card">
      <h1 class="title">URL&nbsp;MAKER</h1>

      <div class="get-current-row">
        <button id="get-current-btn" type="button" class="btn-secondary">Get Current</button>
        <span id="get-current-notice" class="notice" hidden></span>
      </div>

      <div class="buttons">
        <button id="create-btn" type="button" class="btn btn-create">Create</button>
        <button id="create-go-btn" type="button" class="btn btn-go">Create &amp; Go</button>
      </div>

      <div id="result" class="result">
        <span class="result-label">Finalized URL</span>
        <code id="result-url" class="result-url"></code>
      </div>

      <div class="group">
        <label class="field">
          <span class="field-label">Base URL</span>
          <div class="input-wrap">
            <input id="base-url" type="text" placeholder="https://site.com" autocomplete="off" spellcheck="false" />
            <button id="base-url-hist" type="button" class="hist-btn" title="Saved Base URLs" aria-label="Saved Base URLs">▾</button>
          </div>
          <div id="base-url-dropdown" class="saved-panel" hidden></div>
        </label>
        <label class="field">
          <span class="field-label sub">Name (optional)</span>
          <input id="base-url-name" type="text" class="name-input" placeholder="e.g. Acme staging" autocomplete="off" spellcheck="false" />
        </label>
      </div>

      <div class="group">
        <label class="field">
          <span class="field-label">Route</span>
          <div class="input-wrap">
            <input id="route" type="text" placeholder="api/users" autocomplete="off" spellcheck="false" />
            <button id="route-hist" type="button" class="hist-btn" title="Saved Routes" aria-label="Saved Routes">▾</button>
          </div>
          <div id="route-dropdown" class="saved-panel" hidden></div>
        </label>
        <label class="field">
          <span class="field-label sub">Name (optional)</span>
          <input id="route-name" type="text" class="name-input" placeholder="e.g. Orders (admin)" autocomplete="off" spellcheck="false" />
        </label>
      </div>

      <div class="group params-group">
        <span class="field-label">Query Parameters</span>
        <div class="field">
          <div class="input-wrap">
            <button id="params-hist" type="button" class="params-hist-bar" title="Saved parameter sets" aria-label="Saved parameter sets">
              <span class="params-hist-label">Saved parameter sets</span>
              <span class="caret">▾</span>
            </button>
          </div>
          <div id="params-dropdown" class="saved-panel" hidden></div>
        </div>
        <div class="params-save">
          <input id="params-name" type="text" class="name-input" placeholder="Set name (optional)" autocomplete="off" spellcheck="false" />
          <button id="save-params-btn" type="button" class="btn-secondary">Save Params</button>
        </div>
        <div id="params-list"></div>
        <button id="add-param-btn" type="button" class="add-param-btn">+ Add parameter</button>
      </div>

      <div class="appearance-row">
        <label class="field-label sub" for="theme-select">Theme</label>
        <select id="theme-select" data-theme-select data-dropdown></select>
        <label class="motion-toggle">
          <input type="checkbox" data-motion-toggle />
          Reduce motion
        </label>
      </div>
    </main>
    <!-- External only — MV3 CSP blocks inline scripts, which would leave the
         theme picker silently empty. -->
    <script src="theme/dropdown.js"></script>
    <script src="theme/theme-select.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
